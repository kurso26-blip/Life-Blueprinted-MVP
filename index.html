
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Blueprinted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }
        /* Custom scrollbar for brand consistency */
        ::-webkit-scrollbar {
          width: 6px;
        }
        ::-webkit-scrollbar-track {
          background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
          background: #06b6d4;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #0891b2;
        }
        @keyframes progress {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
        .animate-progress {
          animation: progress 1.5s ease-in-out infinite;
        }
        
        /* New Palette Utility Classes */
        .text-midnight { color: #0f172a; }
        .bg-midnight { background-color: #0f172a; }
        .border-midnight { border-color: #0f172a; }
        
        .text-cyan-accent { color: #06b6d4; }
        .bg-cyan-accent { background-color: #06b6d4; }
        .border-cyan-accent { border-color: #06b6d4; }
        
        .text-indigo-highlight { color: #6366f1; }
        .bg-indigo-highlight { background-color: #6366f1; }
        
        .text-slate-muted { color: #64748b; }
        .bg-slate-light { background-color: #f8fafc; }
        .border-slate-subtle { border-color: #f1f5f9; }
    </style>
